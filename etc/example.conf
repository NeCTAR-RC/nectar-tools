[DEFAULT]
# Without log_dir/log_file set, logs go to stderr (suits containers).
#log_dir = /var/log/nectar-tools
#log_file = tools.log
#use_syslog = true
#debug = true

# Deployment environment name, e.g. production or testing. Used to
# indicate to users when they are interacting with a non-production
# system.
environment = production

[dashboard]
# Base URL of the Nectar dashboard, referenced in expiry notification
# emails.
url = https://dashboard.rc.nectar.org.au

[service_auth]
auth_type = password
auth_url = http://keystone.rc.nectar.org.au:5000/v3/
username = admin
password = XXXXX
project_name = admin
user_domain_id = default
project_domain_id = default

[sentry]
# GlitchTip/Sentry compatible DSN. When set, unhandled exceptions and
# ERROR level log messages from all commands are reported automatically.
dsn = https://xxxx@glitchtip.example.com/1
environment = production

[freshdesk]
domain = support.mycloud.org
key = abc123
allocation_group = 123
pt_group = 1234
email_config_id = 4321
provisioning_group = 98765

[keystone]
member_role_id = 2
manager_role_id = 14
